<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Detection</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #1f3c88;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .upload-box {
            border: 2px dashed #1f3c88;
            padding: 35px;
            border-radius: 12px;
            margin: 25px 0;
        }

        input[type="file"] {
            margin: 15px;
        }

        button {
            background: #1f3c88;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #162d69;
        }

        #preview {
            max-width: 300px;
            max-height: 300px;
            margin: 20px auto;
            border-radius: 10px;
            display: none;
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        #confidence {
            margin-top: 10px;
            color: #555;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sign Language Detection</h1>
        <p>Recognize hand gestures using AI</p>
    </header>

    <div class="container">

        <h2>Upload a Sign Image</h2>

        <div class="upload-box">

            <input type="file" id="imageInput" accept="image/*">

            <br>

            <img id="preview" alt="Selected image">

            <br>

            <button onclick="predictSign()">
                Detect Sign
            </button>

        </div>

        <div id="result"></div>
        <div id="confidence"></div>

    </div>

    <script>

        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");

        imageInput.addEventListener("change", function () {

            const file = imageInput.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        });

        async function predictSign() {

            const file = imageInput.files[0];

            if (!file) {
                document.getElementById("result").innerHTML =
                    "Please select an image.";
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            document.getElementById("result").innerHTML =
                "Detecting...";

            document.getElementById("confidence").innerHTML = "";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/predict-image",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail);
                }

                document.getElementById("result").innerHTML =
                    "Detected Sign: " + data.label;

                if (data.confidence !== null) {

                    document.getElementById("confidence").innerHTML =
                        "Confidence: " +
                        (data.confidence * 100).toFixed(2) +
                        "%";
                }

            } catch (error) {

                document.getElementById("result").innerHTML =
                    '<span class="error">Error: ' +
                    error.message +
                    '</span>';
            }
        }

    </script>

</body>
</html>
